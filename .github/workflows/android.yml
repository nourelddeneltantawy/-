name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install and Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        cache-read-only: false

    - name: Prepare Keystore and Environment
      run: |
        if [ ! -f ".env" ]; then
          touch .env
        fi
        if [ ! -f "my-upload-key.jks" ]; then
          echo "Generating consistent upload keystore for signing..."
          keytool -genkeypair -v \
            -keystore my-upload-key.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "WasherMotor2026@Key" \
            -keypass "WasherMotor2026@Key" \
            -dname "CN=AlBaraaElectronics, OU=Engineering, O=AlBaraa, L=Cairo, S=Cairo, C=EG"
        fi

    - name: Build APKs with Gradle
      env:
        KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'WasherMotor2026@Key' }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'WasherMotor2026@Key' }}
        GRADLE_OPTS: "-Dorg.gradle.internal.http.socketTimeout=180000 -Dorg.gradle.internal.http.connectionTimeout=180000 -Dorg.gradle.internal.repository.max.retries=10 -Dorg.gradle.internal.repository.max.tentatives=10"
      run: |
        gradle assembleRelease assembleDebug --stacktrace || (echo "Retrying build after transient network timeout..." && sleep 10 && gradle assembleRelease assembleDebug --stacktrace)

    - name: Upload APKs
      uses: actions/upload-artifact@v4
      with:
        name: albaraa-electronics-apks
        path: |
          app/build/outputs/apk/release/*.apk
          app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
